name: End-of-day pipeline

# Runs every 30 minutes during NSE hours (09:15–15:30 IST = 03:45–10:00 UTC) and once
# after close on weekdays, rebuilds the Brief and Dossiers from screener.in, pushes new
# phone alerts via ntfy.sh, and commits fresh data + alert state — which triggers a redeploy.
on:
  schedule:
    - cron: "*/30 3-10 * * 1-5"
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run python -m finn build
        working-directory: pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: uv run python -m finn.notify
        working-directory: pipeline
        env:
          FINN_NTFY_TOPIC: ${{ vars.FINN_NTFY_TOPIC || 'finn-kartikaya-portfolio' }}
      - name: Commit data
        run: |
          git config user.name "finn-pipeline"
          git config user.email "finn-pipeline@users.noreply.github.com"
          git add web/public/data web/public/data/alerts_state.json
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%F)"
          git push
          gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}
