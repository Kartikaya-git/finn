name: End-of-day pipeline

# Runs after NSE close (15:30 IST = 10:00 UTC) on weekdays, rebuilds the Brief and
# Dossiers from screener.in, and commits fresh data — which triggers a redeploy.
on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run python -m finn build
        working-directory: pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit data
        run: |
          git config user.name "finn-pipeline"
          git config user.email "finn-pipeline@users.noreply.github.com"
          git add web/public/data
          git diff --cached --quiet || git commit -m "data: end-of-day refresh $(date -u +%F)"
          git push
